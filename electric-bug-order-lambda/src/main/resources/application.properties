spring.application.name=electric-bug-order-lambda

# ---- data source toggle ----
# false (default) = read orders/laybys from Postgres (RDS, kept in sync by retailsync-api)
# true            = read orders/laybys live from the AAAPOS REST API instead
externalApiFlag=false

# ---- cloud Postgres (used when externalApiFlag=false) ----
cloud.datasource.url=${CLOUD_DB_URL:jdbc:postgresql://localhost:5432/retailsync_cloud}
cloud.datasource.username=${CLOUD_DB_USER:postgres}
cloud.datasource.password=${CLOUD_DB_PASSWORD:root}
cloud.datasource.driver-class-name=org.postgresql.Driver

# ---- AAAPOS API (used when externalApiFlag=true) ----
aaapos.api.base-url=${AAAPOS_BASE_URL:https://example-aaapos-host/api}
aaapos.api.key=${AAAPOS_API_KEY:}

spring.main.lazy-initialization=true